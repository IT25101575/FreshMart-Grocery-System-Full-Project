services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: freshmart-sql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=FreshMart@2026!
    ports:
      - "1433:1433"
    volumes:
      - freshmart_sql_data:/var/opt/mssql
    restart: unless-stopped
    networks:
      - freshmart-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: freshmart-backend
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=database
    depends_on:
      - database
    restart: unless-stopped
    networks:
      - freshmart-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: freshmart-frontend
    ports:
      - "8000:8000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - freshmart-net

volumes:
  freshmart_sql_data:
    driver: local

networks:
  freshmart-net:
    driver: bridge
